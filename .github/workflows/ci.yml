name: CI

# CI for every spec since 001 (the speech codec's golden file of spec 008, `golden_codec`, and the
# output chain's of spec 009, `golden_output`, and the output clamp's of spec 010,
# `golden_output_clamp`, and the volume transition's of spec 011, `golden_volume_ramp`, and the
# microphone path's of spec 012, `golden_mic`, and the playback speed control's of spec 013, `golden_speed`, and the meters' of spec 016, `golden_meters`, and the processing record's of spec 020, `golden_record`, run wherever the other three
# do; the release timing job prints the codec's cost and checks one
# frame-byte digest in the release profile, 008 research R-03).
#   check         fmt, clippy, tests, C smoke test (ubuntu + macos); golden (001 + AGC + VAS + codec + output + clamp + volume ramp + mic + speed)
#                 with default features, release timing, release-mode AGC and VAS matrices and
#                 edge cases, C header drift (ubuntu)    — 001 T010, T038, T060; 002 T043; 003 T043
#   coverage      >= 80% line coverage (Constitution III)                   — T010
#   golden-matrix golden (001 + AGC + VAS + codec + output + clamp + volume ramp + mic + speed) + determinism on 6 desktop targets (FR-014) — T061
#   ios           golden (001 + AGC + VAS + codec + output + clamp + volume ramp + mic + speed) + determinism in the iOS simulator; iOS builds — T063
#   msrv          full test suite on Rust 1.85                                — T065
# The 8th FR-014 target, a physical iOS device, is a release-time manual gate
# (scripts/ios-device-golden.sh, docs/release-checklist.md).
#
# Triggers: pull requests and pushes to main only. Test-first commits that are deliberately
# red stay on feature branches until the branch is ready (tasks.md "Conventions").
# Changes that touch only documentation (Markdown anywhere, docs/, specs/, the Spec-Kit and
# agent files, the issue templates, LICENSE) skip CI: no job reads them. The traceability audit
# checks the code's citations, not the registers. A change that mixes code and docs runs as usual.
on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'specs/**'
      - '.specify/**'
      - '.claude/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'specs/**'
      - '.specify/**'
      - '.claude/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CBINDGEN_VERSION: 0.29.4

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-features
      - name: C smoke test (FR-023, FR-024)
        run: crates/rr_dr60_ffi/tests/c/run_smoke.sh
      - name: Traceability audit (FR-018, SC-007)
        if: matrix.os == 'ubuntu-latest'
        run: scripts/check-traceability.sh
      - name: Golden files with default features (shipped configuration, no op-count)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p rr_dr60_harness --test golden --test golden_agc --test golden_vas --test golden_codec --test golden_output --test golden_output_clamp --test golden_volume_ramp --test golden_mic --test golden_speed --test golden_meters --test golden_changes --test golden_record_changes --test golden_battery --test golden_record --test golden_bypass
      - name: Timing checks (release; FR-015 bounded work, SC-006; 008 SC-006 and the frame-byte digest)
        if: matrix.os == 'ubuntu-latest'
        # One test at a time: the timing tests measure wall-clock cost and worst blocks, so running
        # them concurrently makes each one measure the others (spec 010 added a seventh; PR #23's
        # first run read 008's worst 64-sample block at 1373 µs against its 1333 µs budget).
        # 012 FR-011: mic_cost's 10 % budget is asserted on the development machine; the shared
        # runner gets a 25 % safety ceiling (its x86-64 select sequences cost more, spec 010).
        env:
          RR_DR60_MIC_COST_CEILING: "25"
          # Spec 010 SC-005 (amended 2026-10-17): the clamp costs about 2.5 % on this runner
          # (3 % stays asserted on the development machine).
          RR_DR60_CLAMP_COST_CEILING: "5"
          # Spec 011's volume-ramp confound guard (the constant-position spread): 2 % on the
          # development machine; one runner type read 2.15 % (2026-10-17).
          RR_DR60_RAMP_SPREAD_CEILING: "4"
          # Spec 013 FR-010 (as built): the speed control's 15 % and the codec-on 1.5x are asserted
          # on the development machine; the shared runner gets safety ceilings.
          RR_DR60_SPEED_COST_CEILING: "25"
          RR_DR60_SPEED_CODEC_RATIO_CEILING: "2.0"
        run: cargo test -p rr_dr60_harness --release --test timing -- --ignored --nocapture --test-threads=1
      - name: AGC and VAS full settings matrices and slow edge cases (release; spec 002 SC-002, R-07; spec 003 SC-002, R-12)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p rr_dr60_harness --release --test agc_matrix --test agc_edge_cases --test vas_matrix --test vas_edge_cases --test us2_memory --test mic_matrix -- --ignored
      - name: Install pinned cbindgen
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@v2
        with:
          tool: cbindgen@${{ env.CBINDGEN_VERSION }}
      - name: C header is up to date
        if: matrix.os == 'ubuntu-latest'
        run: |
          cbindgen --config crates/rr_dr60_ffi/cbindgen.toml --crate rr_dr60_ffi --output crates/rr_dr60_ffi/include/rr_dr60.h
          git diff --exit-code crates/rr_dr60_ffi/include/rr_dr60.h

  coverage:
    # Constitution III: workspace line coverage >= 80%, enforced as soon as the workspace exists.
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Coverage gate (>= 80% lines)
        run: cargo llvm-cov --all-features --workspace --fail-under-lines 80

  golden-matrix:
    # FR-014 / SC-003: one golden file must match bit-for-bit on every target. One set of
    # golden references serves all of them; per-platform golden files are not allowed.
    name: golden (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          # Intel macOS. Fallback if this image is retired: run on macos-latest with
          # `--target x86_64-apple-darwin` (executes under Rosetta 2).
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          # Windows on ARM64. If this hosted runner is unavailable, remove it here: a
          # continue-on-error job does not satisfy FR-014. The target then moves to the
          # release-time manual gate (docs/release-checklist.md).
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Golden files and determinism
        run: cargo test -p rr_dr60_harness --all-features --target ${{ matrix.target }} --test golden --test golden_agc --test golden_vas --test golden_codec --test golden_output --test golden_output_clamp --test golden_volume_ramp --test golden_mic --test golden_speed --test golden_meters --test golden_changes --test golden_record_changes --test golden_battery --test golden_record --test golden_bypass --test determinism

  ios:
    name: ios (simulator + builds)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Golden files and determinism in the iOS simulator
        # .cargo/config.toml routes aarch64-apple-ios-sim binaries through scripts/ios-sim-runner.sh.
        run: cargo test -p rr_dr60_harness --target aarch64-apple-ios-sim --test golden --test golden_agc --test golden_vas --test golden_codec --test golden_output --test golden_output_clamp --test golden_volume_ramp --test golden_mic --test golden_speed --test golden_meters --test golden_changes --test golden_record_changes --test golden_battery --test golden_record --test golden_bypass --test determinism
      - name: Build the C API library for iOS device and Intel simulator
        run: |
          cargo build -p rr_dr60_ffi --release --target aarch64-apple-ios
          cargo build -p rr_dr60_ffi --release --target x86_64-apple-ios

  msrv:
    name: msrv (Rust 1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust 1.85
        run: rustup toolchain install 1.85 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Test on the minimum supported Rust version
        run: cargo +1.85 test --workspace --all-features

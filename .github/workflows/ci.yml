name: CI

# Basic CI (spec 001, tasks.md T010). The cross-platform golden matrix (8 targets, FR-014),
# the iOS jobs, the MSRV job and the release timing job are added in Phase 6 (T061–T065).
#
# Triggers: pull requests and pushes to main only. Test-first commits that are deliberately
# red stay on feature branches until the branch is ready (tasks.md "Conventions").
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CBINDGEN_VERSION: 0.29.4

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-features
      - name: C smoke test (FR-023, FR-024)
        run: crates/rr_dr60_ffi/tests/c/run_smoke.sh
      - name: Golden files with default features (shipped configuration, no op-count)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p rr_dr60_harness --test golden
      - name: Timing checks (release; FR-015 bounded work, SC-006)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p rr_dr60_harness --release --test timing -- --ignored --nocapture
      - name: Install pinned cbindgen
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@v2
        with:
          tool: cbindgen@${{ env.CBINDGEN_VERSION }}
      - name: C header is up to date
        if: matrix.os == 'ubuntu-latest'
        run: |
          cbindgen --config crates/rr_dr60_ffi/cbindgen.toml --crate rr_dr60_ffi --output crates/rr_dr60_ffi/include/rr_dr60.h
          git diff --exit-code crates/rr_dr60_ffi/include/rr_dr60.h

  coverage:
    # Constitution III: workspace line coverage >= 80%, enforced as soon as the workspace exists.
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Coverage gate (>= 80% lines)
        run: cargo llvm-cov --all-features --workspace --fail-under-lines 80

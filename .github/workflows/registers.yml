name: registers

# Spec 007 FR-020 (research R-06; hardware review G6): the stage manifest's cross-check must run
# whenever a hardware register changes, and its result must be able to gate the merge. ci.yml
# skips documentation-only changes workflow-wide (its paths-ignore covers **.md and docs/**),
# so this second, short workflow runs on every pull request, detects inside the job whether
# any file the manifest mirrors or renders changed (the three registers, the CHANGELOG for the
# model versions, the README and docs/guide.md for the generated table, code blocks and stage
# sections, the manifest and its checks), and runs the cargo steps only when one did. Because
# the job always reports, it can be made a required status check (repository settings, the
# maintainer's call); a path-filtered trigger could not, since a skipped required check blocks unrelated pull requests.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: registers-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  registers:
    name: registers (manifest cross-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Did a register, the CHANGELOG, the README or the manifest change?
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "no usable base commit; running the check"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" "${{ github.sha }}")
          echo "$changed"
          if echo "$changed" | grep -Eq '^(docs/hardware/|CHANGELOG\.md$|README\.md$|docs/guide\.md$|crates/rr_dr60/src/manifest\.rs$|crates/rr_dr60/src/controls\.rs$|crates/rr_dr60_harness/src/controls_checks\.rs$|crates/rr_dr60_harness/tests/us1_controls\.rs$|crates/rr_dr60_harness/tests/us2_controls\.rs$|crates/rr_dr60_harness/golden/control-manifest-v1\.txt$|crates/rr_dr60/src/settings\.rs$|crates/rr_dr60_harness/src/manifest_checks\.rs$|crates/rr_dr60_harness/tests/us1_manifest\.rs$|crates/rr_dr60_harness/tests/us2_cross_check\.rs$|crates/rr_dr60_harness/examples/manifest\.rs$|crates/rr_dr60_harness/golden/manifest-v1\.txt$|crates/rr_dr60_ffi/tests/c/smoke\.c$|scripts/check-traceability\.sh$|\.github/workflows/registers\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing the manifest mirrors changed; the cargo steps are skipped"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install toolchain from rust-toolchain.toml
        if: steps.changes.outputs.run == 'true'
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.run == 'true'
      - name: Manifest versus the registers (spec 007 FR-013, FR-019)
        if: steps.changes.outputs.run == 'true'
        run: cargo test -p rr_dr60_harness --test us1_manifest --test us2_cross_check --test us1_controls --test us2_controls
      - name: Traceability audit (spec 007 FR-014)
        if: steps.changes.outputs.run == 'true'
        run: scripts/check-traceability.sh

# The cost A/B on the CI runner (spec 011 FR-009, research R-08; spec 012 FR-011, research R-09):
# the bypassed code against 0.11 (budget 3 %) and stages 1 – 2 on against 0.11 (reported).
# Run once before the merge by adding the `ab-timing` label to the PR (a pull_request workflow
# runs from the PR's merge commit, so it works before this file is on main); also runnable by
# hand on main (`gh workflow run ab-timing.yml`). Never on push or on other PR events. The
# figures are quoted in the PR.
name: ab-timing

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: "Baseline revision (default: c9f9994, version 0.11)"
        required: false
        default: "c9f9994"
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  ab:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'ab-timing'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Bypassed A/B (012 FR-011, budget 3 %)
        run: scripts/ab-timing.sh "${{ inputs.baseline || 'c9f9994' }}"
      - name: Stages 1 – 2 on A/B (012 FR-011, ≤ 10 % corroboration)
        run: scripts/ab-timing.sh "${{ inputs.baseline || 'c9f9994' }}" output_cost_mic
      - name: Playback at the default speed level A/B (013 FR-010, CI ceiling 5 %)
        run: scripts/ab-timing.sh 3a4eefb playback

# The cost A/B on the CI runner (spec 011 FR-009, research R-08; spec 012 FR-011, research R-09):
# the bypassed code against 0.11 (budget 3 %), stages 1 – 2 on against 0.11 (reported), the
# playback against 0.12 (013), the meters against 0.14 (016, asserted at a 12 % ceiling) and the
# sample-timed changes against 0.15 (015, asserted at a 5 % ceiling), the record-side values
# against 0.16 (017, asserted at a 5 % ceiling) and the battery value against 0.17 (018, asserted
# at a 5 % ceiling).
# Run once before the merge by adding the `ab-timing` label to the PR (a pull_request workflow
# runs from the PR's merge commit, so it works before this file is on main); also runnable by
# hand on main (`gh workflow run ab-timing.yml`). Never on push or on other PR events. The
# figures are quoted in the PR.
name: ab-timing

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: "Baseline revision (default: c9f9994, version 0.11)"
        required: false
        default: "c9f9994"
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  ab:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'ab-timing'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Bypassed A/B (012 FR-011, budget 3 %)
        run: scripts/ab-timing.sh "${{ inputs.baseline || 'c9f9994' }}"
      - name: Stages 1 – 2 on A/B (012 FR-011, ≤ 10 % corroboration)
        run: scripts/ab-timing.sh "${{ inputs.baseline || 'c9f9994' }}" output_cost_mic
      - name: Playback at the default speed level A/B (013 FR-010, CI ceiling 5 %)
        run: scripts/ab-timing.sh 3a4eefb playback
      - name: Meters A/B (016 FR-013, ceiling 12 %)
        run: scripts/ab-timing.sh fe82f46 meters
        env:
          RR_DR60_METERS_COST_CEILING: "0.12"
      - name: Changes A/B (015 FR-010, ceiling 5 %)
        run: scripts/ab-timing.sh f1449c2 changes
        env:
          RR_DR60_CHANGES_COST_CEILING: "0.05"
      - name: Record-side values A/B (017 FR-009, ceiling 5 %)
        run: scripts/ab-timing.sh 06e40b0 record
        env:
          RR_DR60_RECORD_COST_CEILING: "0.05"
      - name: Battery value A/B (018 FR-007, ceiling 5 %)
        run: scripts/ab-timing.sh 24ffab9 battery
        env:
          RR_DR60_BATTERY_COST_CEILING: "0.05"
      - name: Speed-change crossfade A/B (019 FR-009, ceiling 5 %)
        run: scripts/ab-timing.sh 13defc7 crossfade
        env:
          RR_DR60_CROSSFADE_COST_CEILING: "0.05"
      - name: Processing record A/B (020 FR-008, ceiling 5 %)
        run: scripts/ab-timing.sh 01a61ca record_contract
        env:
          RR_DR60_RECORD_CONTRACT_COST_CEILING: "0.05"
      - name: Live bypass A/B (021 FR-010, ceiling 5 %)
        run: scripts/ab-timing.sh f303c99 bypass
        env:
          RR_DR60_BYPASS_COST_CEILING: "0.05"
      - name: Pitch-kept mode A/B (023 FR-009, the default mode within 5 %, the pitch-kept ratio within 4 ×)
        run: scripts/ab-timing.sh 12a3c45 pitch
        env:
          RR_DR60_PITCH_DEFAULT_COST_CEILING: "0.05"
          RR_DR60_PITCH_COST_CEILING: "4.0"

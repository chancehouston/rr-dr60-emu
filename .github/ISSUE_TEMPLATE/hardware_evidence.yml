name: Hardware evidence (real RR-DR60)
description: Share recordings, measurements, photos, or documents from a real Panasonic RR-DR60.
labels: ["hardware-evidence"]
body:
  - type: markdown
    attributes:
      value: |
        Real-unit evidence is the most valuable contribution to this project — it lets us verify or correct
        our [assumptions](https://github.com/chancehouston/rr-dr60-emu/blob/main/docs/hardware/assumptions.md).

        **Priority captures (2026-10-17 research; one session answers several open questions).** The unit has **no VAS switch** (A-008), so steady stimuli must stay loud enough to keep it recording, or carry a **keep-alive pattern**: a 30 ms, 2 kHz burst at a moderate level every 0.7 s (first check on the unit that it stops the pausing), with the quiet stretches read between the bursts. Quote levels relative to a loud, limited tone in the same capture, and keep the files' full length: durations and gaps matter.
        1. **P0, the REC lamp in a silent room** (the cheapest test): MIC SENS 5, a quiet room, press REC. Does the REC lamp start flashing (paused) within about 2 s, or stay steady (recording)? The emulator predicts a pause (A-022, A-048); reports differ between units, so several units help.
        2. **P1, playback speed:** SPEED CONTROL on. Record 10 s each of a 1 kHz tone, a 2.3 kHz tone, a sustained vowel and a click train, then play each at speed levels 1–5 into the earphone jack (the level changes only during playback, so turn the dial and let each level run a few seconds), captured at 48 kHz or more. Note whether the level persists after SPEED CONTROL returns to off. The durations give each level's speed ratio; the tone and its faint image (near 6 kHz minus the tone) show whether the codec clock changes, the sound is resampled, or the pitch is kept.
        3. **P3, the start of a recording:** (a) REC after at least 30 s idle, five items; (b) REC immediately after STOP; (c) a steady tone about 20 dB below a limited tone, started before REC; (d) PLAY from idle with a recorded click and a loud tone, on the speaker and on the earphone. The first 1.5 s of each item matter: a fade-in, a thump or a short dip in level (A-037, A-057).
        4. **P6, the speaker and earphone while recording:** record with the speaker in the room and listen; then with a 16 Ω earphone (or a 16 Ω resistor) in the jack, capture the jack while recording (A-058).
        5. **P4, noise processing:** a 1 kHz tone 20 dB below a limited tone for 20 s (also 500 Hz and 2 kHz), and the same tone switched on and off every 0.4 s; a noise level stepped down to the room's quiet, with the keep-alive pattern; speech in pink noise at 20, 10 and 5 dB SNR. A steady tone that fades over a second or so while the switched one holds would show adaptive noise processing (A-009).
        6. **P2, the sample rate:** a recorded 2.2–2.4 kHz tone played at speed level 3 from the earphone jack with the volume up, captured for 10 s or more by an interface or a phone with its input processing off (iOS measurement mode); and a long recording of silence. The tone plus its faint image gives the unit's sample rate (A-011); repeat on as many units as possible.
        7. **P5, battery state on the speaker** (opened unit): a bench supply in place of the cells, swept from 3.2 V down to where the unit stops, a loud 1 kHz tone at a fixed volume, the speaker terminals and NJM2113 pin 6 probed (A-056).
        8. **P7, supply and clock tones:** silent-input recordings at several supply voltages from a bench supply, analyzed with a long FFT: any steady tone, especially one at exactly 2000 Hz (A-011, A-013).

        **Further captures** (play the signal into the RR-DR60's mic from a speaker at a fixed distance, then record the RR-DR60's playback, preferably from the **earphone jack** into an audio interface at 48 kHz / 24-bit; a measurement microphone 10 cm from the speaker is a useful second capture). Unedited files please, and note the battery state, the MIC SENS level and the volume setting:
        - **Level steps:** a 1 kHz tone at loudness levels about 5 dB apart over a 40 dB range (an SPL reading at the recorder helps): shows the AGC's knee and whether the sensitivity setting changes the recorded level.
        - **Sweep:** a slow sine sweep 50 Hz → 8 kHz at a medium level: the codec's band edges.
        - **Steady tones at 1, 2.7, 2.9 and 3.2 kHz**, each a few seconds at the same medium level: the recorded level of the 2.7 and 2.9 kHz tones relative to 1 kHz shows where the codec's top edge really is (the emulator models it near 2.5 kHz from the datasheet, A-027), and a 3.2 kHz tone shows whether the recorder's own anti-alias filtering lets it fold back to 2.8 kHz.
        - **A hand clap or a single click** at a medium level: edge ringing and the filters' transient response.
        - **Bursts and gaps:** 1 s tone bursts separated by gaps of 0.3, 1, 2 and 5 s, at a quiet, a normal and a loud level: VAS hang and onset times, and the AGC's recovery.
        - **A clap after 10 s of silence:** the AGC's attack and any clipped onset.
        - **A loud burst followed by a quiet tone:** how long the gain stays reduced (the model says about 1–2 s, with a faster attack for the next few seconds).
        - **1 kHz 5 s tone bursts in 2 dB SPL steps from 70 to 110 dB SPL (1 dB steps once the level stops rising),** with a sound-level meter beside the recorder: the limiter's knee and ceiling in SPL terms (A-028, A-029). Keep the recorded **waveform**: flat tops at a fixed level, or a clean sine held at a fixed level, decides whether the real limiter clips at full scale or holds just below it, the model's most audible open question.
        - **A tone held for 30 s at 1–2 dB below the level where the ceiling begins:** a slow sag over seconds means a soft knee (an exponential detector); no change means the model's hard threshold is adequate (A-028).
        - **A tone or clap about 10 dB above the knee after 60 s of silence, repeated 1, 3, 5, 10 and 20 s later:** the attack dead time, then how the faster attack decays (A-034, A-028).
        - **Tone onsets at about 2, 5 and 10 dB above the knee, from silence:** the model predicts dead times of about 25, 4.5 and 3 ms; an ordinary RC attack would give the same time at every level (A-034).
        - **A 1 kHz tone 20 dB below the knee plus a 6–8 kHz tone from a tweeter about 5 dB above it,** SPL metered at the recorder: the model predicts the 1 kHz level drops about 5 dB although the recording contains no 6 kHz, because the limiter's detector sees the signal before the codec's filter.
        - **A 1 s loud tone followed by the same tone 10 dB quieter for 5 s:** the release curve (A-035).
        - **Tone bursts stepped down 2 dB at each MIC SENS level until recording pauses, and a constant tone at each level:** the VAS threshold per level, and whether the level also changes the recorded level (A-022, A-033).
        - **Any loud speech:** the clipped side of a loud onset shows which polarity the limiter senses (A-036).
        - **A slowly rising tone or voice:** which comes first as the level rises, a level ceiling or flat-topping (A-028: the emulator holds the level about 1 dB below full scale with no flat-topping; a real unit may clip at full scale instead).
        - **A +9 dBFS-class loud tone for 5 s, stop, then a quiet tone recorded 0.5 s, 2 s and 10 s later:** whether the limiter's charge carries over between items (the emulator starts every recording from a reset state; any upward ramp over 1 dB in the second item's first 2 s would show carried charge, A-037); once with the unit left on between the items and once powered off between them.
        - **3 s of silence recorded as one item, then its displayed length:** whether the device stores the first hang second of silence as the emulator does (A-025, A-039).
        - **The total minutes with one long item versus 99 short ones, with and without VAS pauses:** whether per-item overhead makes the capacity depend on the item count, and whether paused time costs recording time (the emulator counts stored time only and keeps the two limits independent, A-038).
        - **Recording past the 60-minute limit:** whether the last item exists, its length and what the display shows (the emulator stops at the limit and keeps the partial item, A-039).
        - **Quiet room, 60 s, at each MIC SENS level:** noise floor, and whether the VAS pauses.
        - **Pink noise at a low level:** how the speech codec renders non-speech sound.
        - **A sustained vowel, or a click train at 2–5 clicks per second, played back by the unit** (speech codec, A-040, A-041): the coder's frame period shows as a recurring excitation pattern in the played-back waveform, and the click train shows whether the coder's pitch and fixed codebooks reproduce isolated clicks or smear them.
        - **The shortest item the unit keeps** (press record and stop as fast as possible, several times) **and the exact time shown at FULL:** the frame length and the capacity in whole frames (A-040; the emulator rounds a capacity down to whole 20 ms frames).
        - **White noise, a 1 kHz tone and a slow pitch glide (100 → 300 Hz) through the speaker and through the earphone output:** the coder's spectral envelope, its tonal rendering and its pitch tracking (A-041); the two outputs separate the coder's character from the amplifier's and the speaker's.
        - **Speech with 1 s and 3 s pauses** (the unit has no VAS switch): whether the device's pause is frame-granular (the item's length a whole number of frames with the pause's remainder kept or dropped) or sample-granular ahead of the coder, A-041's registered alternative.
        - **Turning the volume thumbwheel during playback** (the volume transition, A-045): record a 1 kHz tone at a moderate level, play it back from the **earphone jack** into a high-impedance input, and flick the wheel end to end ten times fast and ten times slow. The envelope's 10–90 % time, the energy away from the tone during the motion in excess of a steady stretch of the same capture, and the levels at both ends show whether the wiper moves continuously, any contact crackle, and the fastest turn a thumb makes.
        - **Tones at 300 Hz, 1 kHz and 2.5 kHz at equal SPL**, a few seconds each, loud enough to keep the unit recording (it has no VAS switch), with a sound-level meter at the recorder: the microphone path's input high-pass. The emulator models 300 Hz at about −7.3 dB and 2.5 kHz at about +1.7 dB relative to 1 kHz (A-046).
        - **A quiet room recorded for 60 s with the keep-alive pattern above** (or a soft click every 3–4 s, below the level where limiting starts; the unit has no VAS switch; the 0.3–0.9 s after each click is the quiet stretch to analyse), plus a few seconds of a 1 kHz tone loud enough to be limited, as the internal level reference: the capsule's self-noise against full scale (the emulator models the hiss at about −62 dBFS in 300–3000 Hz, A-048), and its spectrum (the input high-pass shapes it).
        - **A silent closet, 60 s at each MIC SENS level 1–5:** whether the recording pauses after the hang time at every level, as the emulator predicts with the hiss alone, or keeps recording at level 5 (A-022, A-048).
        - **The hiss against a limited tone:** a loud 1 kHz tone held for 2 s, then silence: whether the noise after the tone comes back up as the limiter recovers (the emulator only scales the hiss and never lets it hold the limiter, A-048, A-028).
        - **A loud clap or a 1 kHz tone 10 and 20 dB above the level where limiting starts, close to the microphone:** which polarity flattens first in the recorded waveform and where (the emulator limits negative samples first and softly, about 8 dB below the positive side, A-051, A-036).
        - **A photo of the microphone capsule's marking** (a WM-series or similar cross-reference) and its size: the capsule's sensitivity and self-noise (A-005, A-048, A-052).
        - **A board check of C1 (0.15 µF) and R2 (1 kΩ)** near the microphone, and the transistors' rank markings (Q1, Q3): the input corner's value (A-046: 665–985 Hz over the parts' tolerances).
        - **Normal speech.**

        Please describe how you captured it (earphone jack vs. microphone at the speaker, interface, sample rate).
  - type: textarea
    id: unit
    attributes:
      label: Unit details
      description: Model marking, serial range/date code if visible, condition, battery type and charge.
    validations:
      required: true
  - type: textarea
    id: method
    attributes:
      label: Capture method
      description: Signal source, playback path (earphone jack / speaker), recording interface, sample rate, MIC SENS level, SPEED CONTROL position and level, volume setting.
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files or links
      description: Attach files (zip if needed) or link to them. Lossless formats (WAV/FLAC) please.
    validations:
      required: true
  - type: input
    id: assumptions
    attributes:
      label: Assumption IDs this relates to (if known)
      placeholder: e.g. A-001, A-008
  - type: checkboxes
    id: license
    attributes:
      label: Permission
      options:
        - label: I agree these files may be used for analysis and, where small, included in this MIT-licensed repository as test fixtures.
          required: true

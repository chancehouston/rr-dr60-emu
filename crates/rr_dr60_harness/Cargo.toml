[package]
name = "rr_dr60_harness"
description = "Measurement harness and golden-file regression tests for rr_dr60 (not published)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
rr_dr60 = { workspace = true, features = ["__test-hooks"] }
rr_dr60_ffi.workspace = true
rr_dr60_detmath.workspace = true
rustfft = "6.4.1"
sha2 = "0.11.0"
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
# Spec 007: the manifest cross-check's denylist matcher and register parsers (research R-04).
regex = "1"

[features]
# Enables the C API's hidden panic-injection entry point for FR-024 tests (tasks.md T054).
ffi-test-panic = ["rr_dr60_ffi/ffi-test-panic"]

[lints]
workspace = true

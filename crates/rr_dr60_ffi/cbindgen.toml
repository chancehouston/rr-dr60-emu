# cbindgen configuration for rr_dr60.h (research.md R-12; contracts/c-api.md).
# Regenerate from the repository root:
#   cbindgen --config crates/rr_dr60_ffi/cbindgen.toml --crate rr_dr60_ffi --output crates/rr_dr60_ffi/include/rr_dr60.h
language = "C"
include_guard = "RR_DR60_H"
cpp_compat = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
documentation = true
documentation_style = "c99"
style = "both"
header = """
/*
 * rr_dr60.h — C API for rr-dr60-emu, a software emulator of the Panasonic RR-DR60 voice
 * recorder's audio signal chain. GENERATED by cbindgen from crates/rr_dr60_ffi — do not edit.
 *
 * Contract (specs/001-pipeline-skeleton/contracts/c-api.md):
 *  1. Errors are values. No function aborts or unwinds into the caller. A caught internal
 *     error returns RR_DR60_STATUS_INTERNAL_ERROR and poisons the handle until
 *     rr_dr60_reset (or rr_dr60_reconfigure) succeeds.
 *  2. A failed call changes nothing: out-parameters are untouched and state is unchanged.
 *  3. The caller owns all buffers; the library never keeps a pointer after a call returns.
 *     Using a handle after rr_dr60_destroy is undefined behavior.
 *  4. A handle must not be used by two threads at the same time; separate handles are
 *     independent.
 *  5. RrDr60Settings only grows at the end; always start from rr_dr60_settings_default().
 *
 * Real-time safe: rr_dr60_process, rr_dr60_reset, rr_dr60_latency_samples,
 *   rr_dr60_settings_validate.
 * Not real-time safe (allocate): rr_dr60_create, rr_dr60_destroy.
 *
 * SPDX-License-Identifier: MIT
 */"""

[export]
include = ["RrDr60Tap"]
exclude = ["rr_dr60__test_force_panic"]

[enum]
rename_variants = "QualifiedScreamingSnakeCase"

[parse]
parse_deps = false

# cbindgen configuration for rr_dr60.h (research.md R-12; contracts/c-api.md).
# Regenerate from the repository root:
#   cbindgen --config crates/rr_dr60_ffi/cbindgen.toml --crate rr_dr60_ffi --output crates/rr_dr60_ffi/include/rr_dr60.h
language = "C"
include_guard = "RR_DR60_H"
cpp_compat = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
documentation = true
documentation_style = "c99"
style = "both"
header = """
/*
 * rr_dr60.h — C API for rr-dr60-emu, a software emulator of the Panasonic RR-DR60 voice
 * recorder's audio signal chain. GENERATED by cbindgen from crates/rr_dr60_ffi — do not edit.
 *
 * Contract (specs/001-pipeline-skeleton/contracts/c-api.md):
 *  1. Errors are values. No function aborts or unwinds into the caller. A caught internal
 *     error returns RR_DR60_STATUS_INTERNAL_ERROR and poisons the handle until
 *     rr_dr60_reset (or rr_dr60_reconfigure) succeeds.
 *  2. A failed call changes nothing: out-parameters are untouched and state is unchanged.
 *     Exception: the info struct of rr_dr60_process, rr_dr60_process_with_events,
 *     rr_dr60_record, rr_dr60_stop_recording and rr_dr60_play is always written when not
 *     NULL and its struct_size is accepted (spec 022), so a host that only checks `produced`
 *     or `stored` never reads a stale count; a refused struct_size processes nothing.
 *  3. The caller owns all buffers; the library never keeps a pointer after a call returns.
 *     Using a handle after rr_dr60_destroy is undefined behavior.
 *  4. A handle must not be used by two threads at the same time; separate handles are
 *     independent.
 *  5. RrDr60Settings only grows at the end; always start from rr_dr60_settings_default().
 *
 * Real-time safe: rr_dr60_process, rr_dr60_process_with_events, rr_dr60_max_events,
 *   rr_dr60_reset, rr_dr60_latency_samples, rr_dr60_settings_validate,
 *   rr_dr60_start_recording, rr_dr60_record, rr_dr60_max_record_events,
 *   rr_dr60_stop_recording, rr_dr60_start_playback, rr_dr60_play, rr_dr60_stop_playback,
 *   rr_dr60_set_route, rr_dr60_get_route, rr_dr60_set_volume, rr_dr60_get_volume,
 *   rr_dr60_set_battery_volts, rr_dr60_get_battery_volts, rr_dr60_battery_ceiling_factor,
 *   rr_dr60_battery_ceiling_db, rr_dr60_battery_trajectory_row (spec 018; the last three
 *   need no handle),
 *   rr_dr60_speaker_gain_db, rr_dr60_earphone_gain_db (no handle; spec 009),
 *   rr_dr60_meters (spec 016), rr_dr60_get_state, rr_dr60_memory_status,
 *   rr_dr60_recording_length, rr_dr60_export_len, rr_dr60_record_latency_samples,
 *   rr_dr60_playback_latency_samples, rr_dr60_drain_samples, rr_dr60_footprint_bytes,
 *   rr_dr60_get_encoding, rr_dr60_speech_codec_info (constants; no handle; spec 008),
 *   and the stage manifest reads rr_dr60_manifest_stage_count, rr_dr60_manifest_header,
 *   rr_dr60_manifest_stage, rr_dr60_manifest_stage_source, rr_dr60_manifest_stage_assumption
 *   (spec 007; they need no handle and their strings are static for the life of the process).
 * Not real-time safe: rr_dr60_create, rr_dr60_destroy, rr_dr60_reconfigure (allocate);
 *   rr_dr60_erase, rr_dr60_erase_all (a bounded memmove); rr_dr60_export, rr_dr60_import
 *   (a CRC over the recording). The memory's figures and lengths are device samples:
 *   divide by 6000 for seconds (A-026).
 *
 * SPDX-License-Identifier: MIT
 */"""

[export]
include = ["RrDr60Tap", "RrDr60VasMode", "RrDr60Route", "RrDr60State", "RrDr60StopReason", "RrDr60StageStatus", "RrDr60StagePath", "RrDr60Confidence", "RrDr60Encoding", "RrDr60ControlKind", "RrDr60ControlTiming", "RrDr60ControlValueType", "RrDr60Stream", "RrDr60Clock"]
exclude = ["rr_dr60__test_force_panic"]

[enum]
rename_variants = "QualifiedScreamingSnakeCase"

[parse]
parse_deps = false
